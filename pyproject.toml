[project]
name = "ventoux"
version = "0.1.0"  # the package's own, written here once (brief, D82)
description = "Case management and human-in-the-loop workflows for Temporal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]  # carried in the wheel, as the licence asks (brief, D82)
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    # Below the next major only: contracts no longer hash from pydantic's JSON Schema, which
    # changes between minor versions, but from Ventoux's own (brief, D83).
    "pydantic>=2.13.5,<3",
    "temporalio>=1.34.0",
]

[project.optional-dependencies]
# The live model provider (layer 15b): `pip install ventoux[anthropic]`. Imported only by
# `ventoux.authoring.anthropic`, so nothing else needs it (brief, D62).
anthropic = ["anthropic>=1.13.0,<2"]

[project.scripts]
# The `ventoux` command (layer 11g2): `ventoux simulate STORY.json`.
ventoux = "ventoux.tooling.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The live provider's SDK, as the `anthropic` extra pins it: so mypy checks it strictly and
    # its tests run (with a fake client: no test reaches the network, and CI holds no key).
    "anthropic>=1.13.0,<2",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
# Python files only: code blocks in the docs are examples, kept as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# The DSL spike is kept as it was written, a record and not code that runs here.
exclude = ["docs/layers/spike-dsl/*"]
# Beside ruff's defaults, which the version this project locks makes wide (414 rules at
# 0.16.10): `uv run ruff check --show-settings` lists every rule that is on.
extend-select = [
    "TID252",  # relative imports: every import names its layer, so the boundary test can check it
    "B",  # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: the idioms of the Python this project requires
    "I",  # isort: imports sorted
    "SIM",  # flake8-simplify
    "RET",  # flake8-return: every path of a function returns the same way
    "RUF",  # ruff's own rules; RUF100 fails an unused `noqa`
    "C4",  # flake8-comprehensions
    "PIE",  # flake8-pie: needless code
    "PTH",  # pathlib, never os.path
    "ERA",  # no commented-out code
    "N",  # pep8-naming
    "C901",  # a function with more than `max-complexity` branches
    # The rules the code's own `noqa` comments name, each with its reason beside it. This
    # version of ruff has them on by default; named here so each comment stays real whatever
    # a later version's defaults are.
    "S102",  # exec: only on the guides' own examples, in tests
    "BLE001",  # catching Exception
    "ASYNC251",  # time.sleep in an async function
    "DTZ001",  # a datetime with no time zone
    "TRY004",  # a type check that raises something other than TypeError
]
ignore = [
    # The typographic characters in messages and documents (‹ ›, ’, …) are meant.
    "RUF001",
    "RUF002",
    "RUF003",
    # A refusal is named `...Refused` or `...Invalid`, never `...Error`, on purpose.
    "N818",
    # `pytest.raises(match=...)` patterns hold unescaped regex characters: left for a pull
    # request of its own (docs/layers/lint-bar.md).
    "RUF043",
]

[tool.ruff.lint.mccabe]
# A function over this is marked where it is defined; a new one fails (docs/layers/lint-bar.md).
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
# The builder files the guide and the packages are written in, type-checked as a team's would be.
files = ["src", "tests", "examples/builder", "examples/cases", "scripts"]
plugins = ["pydantic.mypy"]
# The quickstart's project, so its tests import `cases.refund` as the quickstart writes it; and
# the tests' helpers, which `scripts/` reaches by path (scripts/clock_held.py).
mypy_path = "examples/quickstart:tests"

# `jsonschema` (tests only) ships no type stubs; its two calls are wrapped in typed helpers.
[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The quickstart's project, so its tests import `cases.refund` as the quickstart writes it.
pythonpath = ["examples/quickstart"]

# The deployment's catalog, its builder files and its packages (layer 14c) (brief, D59). This
# repository's deployment is the development one, named, never guessed.
[tool.ventoux]
catalog = "ventoux.testing:CATALOG"
cases = "examples/cases"
packages = "examples/packages"
