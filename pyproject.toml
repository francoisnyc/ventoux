[project]
name = "ventoux"
version = "0.0.0"
description = "Case management and human-in-the-loop workflows for Temporal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "pydantic>=2.13.5",
    "temporalio>=1.34.0",
]

[project.scripts]
# The `ventoux` command (layer 11g2): `ventoux simulate STORY.json`.
ventoux = "ventoux.tooling.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
# Python files only: code blocks in the docs are examples, kept as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# TID252: relative imports. Every import names its layer, so the boundary test can check it.
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
# The quickstart's project, so its tests import `cases.refund` as the quickstart writes it.
mypy_path = "examples/quickstart"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The quickstart's project, so its tests import `cases.refund` as the quickstart writes it.
pythonpath = ["examples/quickstart"]
