name: CI

on:
  push:
  pull_request:

# Every job's token reads and nothing more: the summary sends nothing, and nothing here writes
# (layer 13e, choice 70). Never `pull_request_target`, which would run the head's code with the
# base's rights.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A test whose task never ends keeps the run from exiting, and nothing inside can stop it:
    # the job ends it, four times the suite's 5 minutes in (fix-overrun-report, choice 1).
    timeout-minutes: 20
    env:
      # Where the activation tests' Temporal dev server is downloaded, and kept between runs
      # (layer 12e): the time-skipping test server doesn't list a queue's pollers.
      TEMPORAL_CLI_DIR: /home/runner/.cache/temporal-cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The dev server the SDK pinned in uv.lock downloads: cached per lockfile.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/temporal-cli
          key: temporal-cli-${{ hashFiles('uv.lock') }}
      # Python 3.12 comes from .python-version; --locked fails if uv.lock is out of date.
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      # The committed JSON is what the builder files write, byte for byte (layer 14d, brief D1):
      # every package generated again and compared, nothing written. Against the configured
      # catalog; then the same in the quickstart's own project.
      - run: uv run ventoux check --unchanged
      - run: cd examples/quickstart && uv run --project ../.. ventoux check --unchanged
      # The committed JSON Schema is what the engine's models say (layer 14e, brief D60): a model
      # changed without `ventoux schema` run again fails here. Nothing written.
      - run: uv run ventoux schema --unchanged

  # What merging a pull request changes, in its job summary (layer 13e): for each package, a
  # release, a wording revision or nothing, then the diff; and each contract changed in place.
  # A push has no pull request base, so a push runs `check` only.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Bounded as `check` is.
    timeout-minutes: 20
    steps:
      # GitHub checks out the merge commit it makes: what merging creates. Its first parent is
      # the base it was made on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The base's promises, from the base's own code and environment (layer 13d, choice 59).
      - run: uv run --directory base --locked ventoux promises > base-promises.json
      # The summary's logic is the command's; this only calls it. It fails the step when
      # something can't be read or is refused, and says why.
      - name: ventoux summary
        env:
          BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: >-
          uv run ventoux summary --base base --head . --packages examples/packages
          --lock contracts.lock.json --base-lock base/contracts.lock.json
          --before base-promises.json
          --summary-file "$GITHUB_STEP_SUMMARY"
          --base-commit "$BASE_COMMIT" --head-commit "$(git rev-parse HEAD)"
